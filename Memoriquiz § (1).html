<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memoriquiz — Juego de Memoria</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf6ff;
    --surface: #ffffff;
    --card-back: #e8d5f5;
    --card-border: #d4b8f0;
    --accent: #f9a8d4;
    --accent2: #fb923c;
    --accent3: #86efac;
    --text: #4a3860;
    --muted: #9d7ec7;
    --shadow: 0 8px 28px rgba(160,100,220,0.13);
    --pastel-yellow: #fde68a;
    --pastel-blue: #bae6fd;
    --pastel-pink: #fbcfe8;
    --pastel-green: #bbf7d0;
    --pastel-purple: #e9d5ff;
    --pastel-orange: #fed7aa;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
      radial-gradient(ellipse at 15% 10%, rgba(251,207,232,0.6) 0%, transparent 45%),
      radial-gradient(ellipse at 85% 90%, rgba(186,230,253,0.5) 0%, transparent 45%),
      radial-gradient(ellipse at 80% 15%, rgba(187,247,208,0.4) 0%, transparent 40%),
      radial-gradient(ellipse at 20% 85%, rgba(233,213,255,0.4) 0%, transparent 40%);
  }

  /* ── Stars bg ── */
  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(3px 3px at 8%  12%, rgba(249,168,212,0.55) 0%, transparent 100%),
      radial-gradient(3px 3px at 28% 58%, rgba(134,239,172,0.45) 0%, transparent 100%),
      radial-gradient(3px 3px at 53% 22%, rgba(186,230,253,0.55) 0%, transparent 100%),
      radial-gradient(3px 3px at 72% 68%, rgba(253,230,138,0.5)  0%, transparent 100%),
      radial-gradient(3px 3px at 88% 38%, rgba(216,180,254,0.5)  0%, transparent 100%),
      radial-gradient(3px 3px at 42% 82%, rgba(254,215,170,0.5)  0%, transparent 100%),
      radial-gradient(3px 3px at 65% 5%,  rgba(249,168,212,0.4)  0%, transparent 100%),
      radial-gradient(3px 3px at 15% 75%, rgba(134,239,172,0.4)  0%, transparent 100%);
    z-index: 0;
  }

  .wrapper {
    position: relative; z-index: 1;
    max-width: 820px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 62px; height: 62px;
    background: linear-gradient(135deg, #f9a8d4, #c4b5fd);
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 20px rgba(196,181,253,0.45), 0 2px 0 rgba(255,255,255,0.4) inset;
    transform: rotate(-6deg);
    flex-shrink: 0;
    transition: transform .3s;
  }
  .logo-icon:hover { transform: rotate(4deg) scale(1.08); }
  .logo-icon svg { width: 38px; height: 38px; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2)); }

  .logo-text {
    font-family: 'Fredoka One', cursive;
    font-size: 2rem;
    line-height: 1;
    background: linear-gradient(135deg, #c084fc 0%, #f9a8d4 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 1px;
  }

  .logo-sub {
    font-size: 0.7rem;
    color: var(--muted);
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* ── COUNTDOWN BAR (inline, cards visible behind) ── */
  #countdown-overlay {
    display: none;
    z-index: 10;
    align-items: center; justify-content: center;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 10px;
  }
  #countdown-overlay.show { display: flex; }

  .countdown-inner {
    background: linear-gradient(135deg, rgba(249,168,212,0.15), rgba(196,181,253,0.12));
    border: 2px solid rgba(196,181,253,0.6);
    border-radius: 16px;
    padding: 8px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    backdrop-filter: blur(0px);
  }

  .countdown-label {
    font-family: 'Fredoka One', cursive;
    font-size: 1rem;
    color: #c084fc;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .countdown-num {
    font-family: 'Fredoka One', cursive;
    font-size: 2.4rem;
    color: #fff;
    line-height: 1;
    min-width: 1.5ch;
    text-align: center;
    text-shadow: 0 0 20px rgba(196,181,253,0.9);
    animation: pulse-num .9s ease-in-out infinite;
  }

  @keyframes pulse-num {
    0%,100% { transform: scale(1); }
    50%      { transform: scale(1.18); }
  }

  /* ── SCOREBOARD ── */
  .scoreboard {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .score-pill {
    background: #fff;
    border: 2px solid var(--card-border);
    border-radius: 14px;
    padding: 8px 16px;
    text-align: center;
    min-width: 90px;
    box-shadow: 0 2px 10px rgba(160,100,220,0.08);
  }

  .score-pill .label {
    font-size: 0.65rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
  }

  .score-pill .value {
    font-family: 'Fredoka One', cursive;
    font-size: 1.5rem;
    line-height: 1.1;
  }

  .score-pill.record .value { color: #f472b6; }
  .score-pill.moves  .value { color: #34d399; }
  .score-pill.time   .value { color: #fb923c; }
  .score-pill.score  .value { color: #a78bfa; }

  /* ── CONTROLS ── */
  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .difficulty {
    display: flex;
    gap: 6px;
  }

  .diff-btn {
    background: #fff;
    border: 2px solid var(--card-border);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 20px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all .2s;
    letter-spacing: .5px;
  }

  .diff-btn.active, .diff-btn:hover {
    background: linear-gradient(135deg, #f9a8d4, #c4b5fd);
    border-color: #c4b5fd;
    color: #4a3860;
  }

  .btn-new {
    background: linear-gradient(135deg, #fb923c, #f472b6);
    border: none;
    color: white;
    padding: 10px 22px;
    border-radius: 24px;
    font-family: 'Fredoka One', cursive;
    font-size: 1rem;
    cursor: pointer;
    letter-spacing: .5px;
    box-shadow: 0 4px 14px rgba(251,146,60,0.35);
    transition: transform .15s, box-shadow .15s;
  }

  .btn-new:hover  { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(251,146,60,0.45); }
  .btn-new:active { transform: scale(0.97); }

  /* ── GRID ── */
  #board {
    display: grid;
    gap: 10px;
    justify-content: center;
    margin: 0 auto;
  }

  /* ── CARD ── */
  .card {
    aspect-ratio: 1;
    perspective: 600px;
    cursor: pointer;
  }

  .card-inner {
    width: 100%; height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform .45s cubic-bezier(.4,0,.2,1);
    border-radius: 14px;
  }

  .card.flipped .card-inner { transform: rotateY(180deg); }
  .card.matched .card-inner { transform: rotateY(180deg); }

  .card-face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.4em;
    box-shadow: var(--shadow);
    user-select: none;
  }

  .card-back {
    background: linear-gradient(135deg, #e9d5ff, #ddd6fe);
    border: 2px solid #c4b5fd;
  }

  .card-back::after {
    content: '?';
    font-family: 'Fredoka One', cursive;
    font-size: 1.6em;
    color: rgba(160,100,220,0.35);
  }

  .card-front {
    background: linear-gradient(135deg, #fff, #fdf4ff);
    border: 2px solid #e9d5ff;
    transform: rotateY(180deg);
    transition: background .3s;
  }

  .card.matched .card-front {
    background: linear-gradient(135deg, #d1fae5, #bbf7d0);
    border-color: #6ee7b7;
    box-shadow: 0 0 18px rgba(110,231,183,0.45);
  }

  .card:not(.flipped):not(.matched):hover .card-inner {
    transform: rotateY(10deg) scale(1.04);
  }

  /* ── COMBO ── */
  .combo-banner {
    text-align: center;
    font-family: 'Fredoka One', cursive;
    font-size: 1.3rem;
    color: #c084fc;
    min-height: 30px;
    margin-bottom: 10px;
    letter-spacing: 1px;
    transition: opacity .3s;
  }

  /* ── WIN OVERLAY ── */
  #win-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(100,60,140,0.35);
    backdrop-filter: blur(6px);
    z-index: 100;
    align-items: center; justify-content: center;
  }

  #win-overlay.show { display: flex; }

  .win-card {
    background: #fff;
    border: 2px solid #e9d5ff;
    border-radius: 24px;
    padding: 40px 50px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(160,100,220,0.2);
    animation: popIn .4s cubic-bezier(.175,.885,.32,1.275);
    max-width: 380px; width: 90%;
  }

  @keyframes popIn {
    from { transform: scale(0.5); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }

  .win-trophy { font-size: 4rem; margin-bottom: 10px; }

  .win-title {
    font-family: 'Fredoka One', cursive;
    font-size: 2rem;
    background: linear-gradient(135deg, #c084fc, #f9a8d4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }

  .win-msg { color: #9d7ec7; margin-bottom: 20px; font-weight: 600; }

  .win-stats {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .win-stat {
    background: #fdf4ff;
    border-radius: 12px;
    padding: 10px 18px;
    font-weight: 700;
    border: 1px solid #e9d5ff;
  }

  .win-stat span { display: block; color: #9d7ec7; font-size: .7rem; text-transform: uppercase; letter-spacing: 1.5px; }
  .win-stat strong { font-family: 'Fredoka One', cursive; font-size: 1.5rem; }

  .btn-play-again {
    background: linear-gradient(135deg, #86efac, #34d399);
    color: #064e3b;
    border: none;
    padding: 12px 30px;
    border-radius: 24px;
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(52,211,153,0.35);
    transition: transform .15s;
  }
  .btn-play-again:hover { transform: translateY(-2px) scale(1.04); }

  .new-record-badge {
    display: inline-block;
    background: linear-gradient(135deg, #f9a8d4, #c4b5fd);
    color: #4a3860;
    font-size: .7rem;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 12px;
  }


  /* ── CONFETTI ── */
  @keyframes confetti-fall {
    0%   { transform: translateY(-20px) rotate(0deg) scale(1); opacity: 1; }
    80%  { opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg) scale(0.5); opacity: 0; }
  }
  @keyframes confetti-sway {
    0%,100% { margin-left: 0; }
    25%      { margin-left: 30px; }
    75%      { margin-left: -30px; }
  }
  .confetti-piece {
    position: fixed;
    top: -20px;
    width: 10px; height: 14px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 300;
    animation: confetti-fall linear forwards, confetti-sway ease-in-out infinite;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 500px) {
    .logo-text { font-size: 1.5rem; }
    .logo-icon { width: 42px; height: 42px; font-size: 20px; }
    .score-pill { min-width: 70px; padding: 6px 10px; }
  }

  /* ── STREAK particles (CSS only) ── */
  @keyframes float-particle {
    0%   { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-60px) scale(0); opacity: 0; }
  }

  .particle {
    position: fixed;
    pointer-events: none;
    font-size: 1.4rem;
    animation: float-particle .8s ease-out forwards;
    z-index: 200;
  }
</style>
</head>
<body>
<div class="wrapper">

  <header>
    <div class="logo">
      <div class="logo-icon">
        <!-- Cute paw print SVG -->
        <svg width="36" height="36" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Main pad -->
          <ellipse cx="50" cy="65" rx="26" ry="22" fill="rgba(255,255,255,0.92)"/>
          <!-- Toe pads -->
          <ellipse cx="22" cy="40" rx="11" ry="13" fill="rgba(255,255,255,0.92)"/>
          <ellipse cx="40" cy="30" rx="11" ry="13" fill="rgba(255,255,255,0.92)"/>
          <ellipse cx="60" cy="30" rx="11" ry="13" fill="rgba(255,255,255,0.92)"/>
          <ellipse cx="78" cy="40" rx="11" ry="13" fill="rgba(255,255,255,0.92)"/>
          <!-- Inner pad detail -->
          <ellipse cx="50" cy="65" rx="14" ry="11" fill="rgba(255,160,80,0.35)"/>
          <!-- Heart cutout on main pad -->
          <path d="M50 59 C50 59 44 54 44 50.5 C44 48 46 46.5 48 46.5 C49.2 46.5 50 47.5 50 47.5 C50 47.5 50.8 46.5 52 46.5 C54 46.5 56 48 56 50.5 C56 54 50 59 50 59Z" fill="rgba(255,120,100,0.5)"/>
        </svg>
      </div>
      <div>
        <div class="logo-text">Memoriquiz</div>
        <div class="logo-sub">Juego de Memoria</div>
      </div>
    </div>
    <div class="scoreboard">
      <div class="score-pill record">
        <div class="label">🏆 Récord</div>
        <div class="value" id="record-display">---</div>
      </div>
      <div class="score-pill score">
        <div class="label">⭐ Puntos</div>
        <div class="value" id="score-display">0</div>
      </div>
      <div class="score-pill moves">
        <div class="label">🎯 Movs</div>
        <div class="value" id="moves-display">0</div>
      </div>
      <div class="score-pill time">
        <div class="label">⏱ Tiempo</div>
        <div class="value" id="timer-display">0s</div>
      </div>
    </div>
  </header>

  <div class="controls">
    <div class="difficulty">
      <button class="diff-btn active" data-pairs="6">Fácil</button>
      <button class="diff-btn" data-pairs="10">Medio</button>
      <button class="diff-btn" data-pairs="16">Difícil</button>
    </div>
    <button class="btn-new" onclick="newGame()">🔀 Nueva Partida</button>
  </div>

  <!-- COUNTDOWN BAR -->
  <div id="countdown-overlay">
    <div class="countdown-inner">
      <div class="countdown-label">🧠 ¡Memoriza!</div>
      <div class="countdown-num" id="countdown-num">4</div>
    </div>
  </div>
  <div class="combo-banner" id="combo-banner"></div>
  <div id="board"></div>
</div>

<!-- WIN OVERLAY -->
<div id="win-overlay">
  <div class="win-card">
    <div class="win-trophy">🎉</div>
    <div id="new-record-badge" class="new-record-badge" style="display:none">¡NUEVO RÉCORD!</div>
    <div class="win-title">¡Ganaste!</div>
    <div class="win-msg" id="win-msg">¡Memoria increíble!</div>
    <div class="win-stats">
      <div class="win-stat"><span>Puntos</span><strong id="win-score">0</strong></div>
      <div class="win-stat"><span>Movimientos</span><strong id="win-moves">0</strong></div>
      <div class="win-stat"><span>Tiempo</span><strong id="win-time">0s</strong></div>
    </div>
    <button class="btn-play-again" onclick="newGame()">▶ Jugar de Nuevo</button>
  </div>
</div>

<script>
/* ── EMOJI POOL ── */
const EMOJIS = [
  '🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯',
  '🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐦','🦆','🦅',
  '🦉','🦇','🐺','🐗','🐴','🦄','🐝','🪱','🦋','🐛',
  '🍎','🍊','🍋','🍇','🍓','🫐','🍒','🍑','🥭','🍍',
  '🥝','🍅','🥑','🌽','🥕','🧅','🍄','🌰','🥥','🍈',
];

/* ── AUDIO ENGINE (Web Audio API) ── */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let ctx;

function getCtx() {
  if (!ctx) ctx = new AudioCtx();
  return ctx;
}

function playTone(freq, type='sine', duration=0.15, gain=0.3, delay=0) {
  const c = getCtx();
  const osc = c.createOscillator();
  const g   = c.createGain();
  osc.connect(g); g.connect(c.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, c.currentTime + delay);
  g.gain.setValueAtTime(0, c.currentTime + delay);
  g.gain.linearRampToValueAtTime(gain, c.currentTime + delay + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + delay + duration);
  osc.start(c.currentTime + delay);
  osc.stop(c.currentTime + delay + duration + 0.02);
}

function soundFlip()  { playTone(520, 'sine', 0.1, 0.2); }
function soundMatch() {
  playTone(660, 'triangle', 0.12, 0.3, 0);
  playTone(880, 'triangle', 0.12, 0.3, 0.12);
  playTone(1100,'triangle', 0.15, 0.3, 0.24);
}
function soundMiss()  { playTone(220, 'sawtooth', 0.15, 0.18); }
function soundWin()   {
  [523,659,784,1047].forEach((f,i) => playTone(f,'sine',0.2,0.25,i*0.12));
}
function soundCombo() {
  playTone(900,'square',0.08,0.25,0);
  playTone(1100,'square',0.08,0.25,0.08);
  playTone(1350,'square',0.1,0.25,0.16);
}

/* ── STATE ── */
let cards = [], flipped = [], matched = 0, moves = 0;
let score = 0, combo = 0;
let timerInterval = null, countdownTick = null, startTime = null, elapsed = 0;
let locked = false;
let currentPairs = 6;
let records = JSON.parse(localStorage.getItem('memoriquiz_records') || '{}');

/* ── DIFFICULTY COLS ── */
function colsForPairs(p) {
  if (p === 6)  return 4;
  if (p === 10) return 5;
  return 6;
}

/* ── INIT ── */
function newGame() {
  clearInterval(timerInterval);
  clearInterval(countdownTick);
  countdownTick = null;
  timerInterval = null;
  startTime = null;
  document.getElementById('countdown-overlay').classList.remove('show');
  document.getElementById('win-overlay').classList.remove('show');
  document.getElementById('combo-banner').textContent = '';

  flipped = []; matched = 0; moves = 0; score = 0; combo = 0; locked = false;
  elapsed = 0;

  updateMoves(); updateScore(); updateTimer();

  const pool  = [...EMOJIS].sort(() => Math.random() - 0.5).slice(0, currentPairs);
  const deck  = [...pool, ...pool].sort(() => Math.random() - 0.5);
  const board = document.getElementById('board');
  const cols  = colsForPairs(currentPairs);

  board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  const cardW = Math.min(Math.floor((Math.min(window.innerWidth - 64, 820) - (cols - 1) * 10) / cols), 110);
  board.style.maxWidth = `${cols * cardW + (cols - 1) * 10}px`;

  board.innerHTML = '';
  cards = deck.map((emoji, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.width = `${cardW}px`;
    card.dataset.emoji = emoji;
    card.dataset.index = i;
    card.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back"></div>
        <div class="card-face card-front">${emoji}</div>
      </div>`;
    card.addEventListener('click', () => onCardClick(card));
    board.appendChild(card);
    return card;
  });

  // 4-second memorize countdown for all difficulties
  locked = true;
  cards.forEach(c => c.classList.add('flipped'));

  const overlay = document.getElementById('countdown-overlay');
  const numEl   = document.getElementById('countdown-num');
  let count = 4;
  numEl.textContent = count;
  overlay.classList.add('show');

  countdownTick = setInterval(() => {
    count--;
    if (count > 0) {
      numEl.textContent = count;
    } else {
      clearInterval(countdownTick);
      countdownTick = null;
      overlay.classList.remove('show');
      cards.forEach(c => c.classList.remove('flipped'));
      locked = false;
      startTime = Date.now();
      elapsed = 0;
      timerInterval = setInterval(() => {
        elapsed = Math.floor((Date.now() - startTime) / 1000);
        updateTimer();
      }, 1000);
    }
  }, 1000);
}

/* ── CARD CLICK ── */
function onCardClick(card) {
  if (locked) return;
  if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
  if (!startTime) return;

  soundFlip();
  card.classList.add('flipped');
  flipped.push(card);

  if (flipped.length === 2) {
    locked = true;
    moves++;
    updateMoves();
    const [a, b] = flipped;

    if (a.dataset.emoji === b.dataset.emoji) {
      // MATCH
      setTimeout(() => {
        a.classList.add('matched');
        b.classList.add('matched');
        soundMatch();
        combo++;

        const timeBonus  = Math.max(0, 30 - elapsed);
        const comboMult  = combo >= 3 ? 2 : 1;
        const pts        = (100 + timeBonus) * comboMult;
        score += pts;
        updateScore();

        if (combo >= 2) {
          soundCombo();
          showCombo(combo);
          spawnParticles(b);
        }

        flipped = []; locked = false;
        matched++;

        if (matched === currentPairs) setTimeout(onWin, 300);
      }, 300);
    } else {
      // MISS
      combo = 0;
      hideBanner();
      setTimeout(() => {
        a.classList.remove('flipped');
        b.classList.remove('flipped');
        soundMiss();
        flipped = []; locked = false;
      }, 800);
    }
  }
}

/* ── WIN ── */
function onWin() {
  clearInterval(timerInterval);
  soundWin();
  launchConfetti();
  const key = `d${currentPairs}`;
  const prev = records[key];
  const isRecord = !prev || score > prev.score;
  if (isRecord) {
    records[key] = { score, moves, time: elapsed };
    localStorage.setItem('memoriquiz_records', JSON.stringify(records));
    updateRecordDisplay();
  }

  document.getElementById('win-score').textContent = score;
  document.getElementById('win-moves').textContent = moves;
  document.getElementById('win-time').textContent  = elapsed + 's';
  document.getElementById('new-record-badge').style.display = isRecord ? 'inline-block' : 'none';

  const msgs = ['¡Memoria increíble!','¡Eres un campeón!','¡Imparable!','¡Asombroso!'];
  document.getElementById('win-msg').textContent = msgs[Math.floor(Math.random()*msgs.length)];
  document.getElementById('win-overlay').classList.add('show');
}

/* ── UI HELPERS ── */
function updateMoves() { document.getElementById('moves-display').textContent = moves; }
function updateScore() { document.getElementById('score-display').textContent = score; }
function updateTimer() { document.getElementById('timer-display').textContent = elapsed + 's'; }

function updateRecordDisplay() {
  const key  = `d${currentPairs}`;
  const rec  = records[key];
  document.getElementById('record-display').textContent = rec ? rec.score : '---';
}

function showCombo(n) {
  const labels = ['','','🔥x2','🔥🔥x3','⚡x4','💥x5','🌟x6','👑x7'];
  const banner = document.getElementById('combo-banner');
  banner.textContent = (labels[n] || `🎆 x${n}`) + ' ¡Combo!';
}

function hideBanner() {
  document.getElementById('combo-banner').textContent = '';
}

/* ── PARTICLES ── */
function spawnParticles(card) {
  const rect = card.getBoundingClientRect();
  const cx   = rect.left + rect.width / 2;
  const cy   = rect.top  + rect.height / 2;
  const emojis = ['✨','⭐','💫','🌟'];
  for (let i = 0; i < 5; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    p.style.left = (cx + (Math.random() - 0.5) * 60) + 'px';
    p.style.top  = (cy + (Math.random() - 0.5) * 40) + 'px';
    p.style.animationDuration = (0.6 + Math.random() * 0.4) + 's';
    document.body.appendChild(p);
    p.addEventListener('animationend', () => p.remove());
  }
}


/* ── CONFETTI ── */
function launchConfetti() {
  const colors = ['#f9a8d4','#c4b5fd','#86efac','#fde68a','#bae6fd','#fb923c','#a5f3fc'];
  const shapes = ['rectangle','circle'];
  for (let i = 0; i < 120; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    const color = colors[Math.floor(Math.random() * colors.length)];
    const shape = shapes[Math.floor(Math.random() * shapes.length)];
    const size  = 7 + Math.random() * 8;
    p.style.cssText = `
      left: ${Math.random() * 100}vw;
      width: ${size}px;
      height: ${size * (shape === 'rectangle' ? 1.6 : 1)}px;
      border-radius: ${shape === 'circle' ? '50%' : '2px'};
      background: ${color};
      animation-duration: ${2.5 + Math.random() * 2}s, ${1 + Math.random()}s;
      animation-delay: ${Math.random() * 1.2}s, 0s;
    `;
    document.body.appendChild(p);
    p.addEventListener('animationend', () => p.remove(), { once: true });
  }
}

/* ── DIFFICULTY BUTTONS ── */
document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPairs = parseInt(btn.dataset.pairs);
    updateRecordDisplay();
    newGame();
  });
});

/* ── BOOT ── */
updateRecordDisplay();
newGame();
</script>
